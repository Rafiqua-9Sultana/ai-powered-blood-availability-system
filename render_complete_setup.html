<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COMPLETE_SETUP_SUMMARY - Rendered</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; line-height:1.6; padding:24px; max-width:1000px; margin:0 auto; background:#f8fafc; color:#0f172a }
      pre.hljs { padding:16px; border-radius:6px; overflow:auto }
      img { max-width:100% }
      .container { background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 6px 18px rgba(2,6,23,0.08) }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="content">Loading documentation…</div>
    </div>

    <!-- marked (markdown -> html) and highlight.js for code blocks -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script>
      // Configure marked to use highlight.js
      marked.setOptions({
        highlight: function(code, lang) {
          try { return hljs.highlight(code, {language: lang || 'plaintext'}).value }
          catch (e) { return hljs.highlightAuto(code).value }
        }
      });

      // Fetch the markdown file (served by the running http.server)
      fetch('COMPLETE_SETUP_SUMMARY.md')
        .then(function(resp) {
          if (!resp.ok) throw new Error('Failed to fetch markdown: ' + resp.status);
          return resp.text();
        })
        .then(function(md) {
          document.getElementById('content').innerHTML = marked.parse(md);
        })
        .catch(function(err) {
          document.getElementById('content').textContent = 'Error loading file: ' + err.message;
        });
    </script>
  </body>
</html>
